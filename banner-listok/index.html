<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Баннер: листок с записями</title>
<style>
  :root { --bg: #f4f1ea; --ink: #1d1f22; --muted: #5d6066; --card: #fff; --accent: #2d5bd7; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141518; --ink: #eeeeec; --muted: #a2a5ab; --card: #1d1f23; --accent: #7d9cf0; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 36px 16px 56px; }
  h1 { font-size: clamp(24px, 4vw, 36px); line-height: 1.15; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 28px; max-width: 62ch; }
  figure { margin: 0 0 32px; background: var(--card); border-radius: 14px; overflow: hidden; }
  img { display: block; width: 100%; height: auto; }
  figcaption { padding: 12px 16px 14px; font-weight: 600; }
  figcaption span { color: var(--muted); font-weight: 400; }
  figcaption a { color: var(--accent); margin-left: 6px; }
</style>
</head>
<body>
<main>
  <h1>Баннер для лендинга: листок из блокнота с записями</h1>
  <p>Три варианта под задачу. Формат 16:9, 1920 px; исходники — в 2K. Пустое место сбоку оставлено под заголовок лендинга. Текст на листке, цвет стола и ручки поменяю под вашу тему.</p>
  <figure><img src="v3.jpg" width="1920" height="1080" alt="Листок из блокнота с рукописными заметками на русском на светлом столе"><figcaption>1. Записи по-русски, светлый стол <span>— место под заголовок справа</span><a href="v3.jpg" download>скачать</a></figcaption></figure>
  <figure><img src="v1.jpg" width="1920" height="1080" alt="Листок из блокнота с записями и чек-листом на светлом столе"><figcaption>2. Тот же кадр, записи по-английски <span>— если лендинг на английском</span><a href="v1.jpg" download>скачать</a></figcaption></figure>
  <figure><img src="v2.jpg" width="1920" height="1080" alt="Листок в клетку со схемой на тёмном деревянном столе с кофе"><figcaption>3. Тёмный стол, схема и кофе <span>— место под заголовок слева</span><a href="v2.jpg" download>скачать</a></figcaption></figure>
</main>

</html>
