<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Баннер для Авито: аренда биотуалетов</title>
<style>
  :root { --bg: #f4f2ec; --ink: #141414; --muted: #5b5b5b; --accent: #ffcb44; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: clamp(24px, 4vw, 36px); line-height: 1.15; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 32px; max-width: 60ch; }
  figure { margin: 0 0 40px; }
  img { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  figcaption { margin-top: 12px; font-weight: 600; }
  figcaption span { display: inline-block; background: var(--accent); padding: 2px 10px; border-radius: 999px; margin-right: 8px; }
</style>
</head>
<body>
<main>
  <h1>Первое фото для объявления на Авито — аренда биотуалетов</h1>
  <p>Пример под задачу: фото товара с сайта, фирменные цвета сайта, заголовок и четыре преимущества. Формат 4:3, как у первого фото на Авито. Два варианта расположения текста.</p>
  <figure>
    <img src="v1.jpg" width="1600" height="1195" alt="Баннер «Биотуалеты в аренду!» — вариант 1">
    <figcaption><span>1</span>Спокойный шрифт, преимущества в одну колонку</figcaption>
  </figure>
  <figure>
    <img src="v2.jpg" width="1600" height="1195" alt="Баннер «Биотуалеты в аренду!» — вариант 2">
    <figcaption><span>2</span>Узкий крупный заголовок, акцент на первых словах</figcaption>
  </figure>
</main>
</body>
</html>
